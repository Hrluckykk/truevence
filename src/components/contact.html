<!-- ============ CONTACT ============ -->
<section id="contact" class="py-24 md:py-32 bg-paper scroll-mt-24">
  <div style="width:100%; max-width:100%; padding-left:250px; padding-right:220px;" class="relative">
    <div class="grid lg:grid-cols-5 gap-14">

      <div class="lg:col-span-2" data-aos="fade-up">
        <span class="font-mono-ui text-[12px] tracking-[0.18em] text-violet font-semibold">GET IN TOUCH</span>
        <h2 class="font-display font-extrabold text-3xl sm:text-4xl mt-3 mb-6 leading-tight">Let's start the verification.</h2>
        <p class="text-slate leading-relaxed mb-10">Send over the role and candidate details, or reach us directly. We typically respond the same business day.</p>

        <div class="space-y-5">
          <a href="mailto:Contact@truevence.in" class="flex items-center gap-4 group">
            <span class="w-11 h-11 rounded-xl bg-violet/10 flex items-center justify-center shrink-0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
            </span>
            <span>
              <span class="block font-mono-ui text-[11px] text-slate">EMAIL</span>
              <span class="font-display font-semibold group-hover:text-violet transition-colors">Contact@truevence.in</span>
            </span>
          </a>
          <a href="tel:+918383091474" class="flex items-center gap-4 group">
            <span class="w-11 h-11 rounded-xl bg-violet/10 flex items-center justify-center shrink-0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <span>
              <span class="block font-mono-ui text-[11px] text-slate">CALL</span>
              <span class="font-display font-semibold group-hover:text-violet transition-colors">83830 91474</span>
            </span>
          </a>
          <a href="https://www.truevence.in" target="_blank" rel="noopener" class="flex items-center gap-4 group">
            <span class="w-11 h-11 rounded-xl bg-violet/10 flex items-center justify-center shrink-0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
            </span>
            <span>
              <span class="block font-mono-ui text-[11px] text-slate">WEBSITE</span>
              <span class="font-display font-semibold group-hover:text-violet transition-colors">www.truevence.in</span>
            </span>
          </a>
        </div>
      </div>

      <div class="lg:col-span-3" data-aos="fade-up" data-aos-delay="100">
        <form id="contactForm" class="bg-white border border-ink/8 rounded-2xl p-7 md:p-9 space-y-5">
          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label for="fname" class="block font-mono-ui text-[11px] text-slate mb-2">FULL NAME</label>
              <input required id="fname" name="name" type="text" placeholder="Your name" class="w-full border border-ink/12 rounded-xl px-4 py-3 text-sm outline-none focus:border-violet transition-colors bg-paper/40">
            </div>
            <div>
              <label for="company" class="block font-mono-ui text-[11px] text-slate mb-2">COMPANY</label>
              <input id="company" name="company" type="text" placeholder="Company name" class="w-full border border-ink/12 rounded-xl px-4 py-3 text-sm outline-none focus:border-violet transition-colors bg-paper/40">
            </div>
          </div>
          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label for="email" class="block font-mono-ui text-[11px] text-slate mb-2">EMAIL</label>
              <input required id="email" name="email" type="email" placeholder="you@company.com" class="w-full border border-ink/12 rounded-xl px-4 py-3 text-sm outline-none focus:border-violet transition-colors bg-paper/40">
            </div>
            <div>
              <label for="phone" class="block font-mono-ui text-[11px] text-slate mb-2">PHONE</label>
              <input id="phone" name="phone" type="tel" placeholder="Your phone number" class="w-full border border-ink/12 rounded-xl px-4 py-3 text-sm outline-none focus:border-violet transition-colors bg-paper/40">
            </div>
          </div>
          <div>
            <label for="message" class="block font-mono-ui text-[11px] text-slate mb-2">WHAT DO YOU NEED VERIFIED?</label>
            <textarea required id="message" name="message" rows="4" placeholder="Tell us about the role and checks required..." class="w-full border border-ink/12 rounded-xl px-4 py-3 text-sm outline-none focus:border-violet transition-colors bg-paper/40 resize-none"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full sm:w-auto font-display text-[15px] font-bold px-8 py-3.5 rounded-full inline-flex items-center justify-center gap-2">
            Send Request
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <p id="formNote" class="hidden text-xs text-slate" aria-live="polite"></p>
        </form>
      </div>

    </div>
  </div>
</section>
