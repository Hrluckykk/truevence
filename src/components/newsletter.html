<!-- ============ NEWSLETTER ============ -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  .newsletter *{box-sizing:border-box}

  .newsletter{
    position:relative;
    width:100%;
    min-height:793px;
    overflow:hidden;
    background:
      linear-gradient(rgba(116,83,235,.075) 1px,transparent 1px),
      linear-gradient(90deg,rgba(116,83,235,.075) 1px,transparent 1px),
      #fff;
    background-size:42px 42px;
    color:#0b153d;
    font-family:Inter,Arial,sans-serif;
  }

  .newsletter:after{
    content:"";
    position:absolute;
    width:720px;
    height:720px;
    right:-80px;
    top:30px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(129,91,255,.14) 0%,rgba(129,91,255,.065) 35%,rgba(129,91,255,0) 72%);
    pointer-events:none;
  }

  .newsletter .content{
    position:relative;
    z-index:2;
    width:min(100% - 128px,1740px);
    margin:0 auto;
    min-height:793px;
    display:grid;
    grid-template-columns:55% 45%;
    align-items:center;
  }

  .newsletter .left{
    padding-top:4px;
  }

  .newsletter .eyebrow{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:38px;
    color:#7440ee;
    font-size:20px;
    line-height:1;
    letter-spacing:5px;
    font-weight:700;
  }

  .newsletter .eyebrow-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#7b45f5;
    box-shadow:0 0 0 8px rgba(123,69,245,.10);
  }

  .newsletter h1{
    margin:0;
    max-width:730px;
    font-size:78px;
    line-height:.99;
    letter-spacing:-4px;
    font-weight:800;
    color:#0a153d;
  }

  .newsletter h1 .purple{color:#7040ef}

  .newsletter .sub{
    max-width:770px;
    margin:42px 0 0;
    color:#617084;
    font-size:25px;
    line-height:1.48;
    letter-spacing:-.35px;
    font-weight:500;
  }

  .newsletter .signup{
    display:flex;
    align-items:center;
    width:885px;
    max-width:100%;
    height:84px;
    margin-top:43px;
    border:2px solid #e1def0;
    border-radius:44px;
    background:rgba(255,255,255,.94);
    box-shadow:0 7px 24px rgba(37,24,95,.055);
    overflow:hidden;
  }

  .newsletter .mail-icon{
    position:relative;
    flex:0 0 30px;
    width:30px;
    height:23px;
    margin-left:35px;
    border:3px solid #15204a;
    border-radius:4px;
  }
  .newsletter .mail-icon:before,.newsletter .mail-icon:after{
    content:"";
    position:absolute;
    top:2px;
    width:17px;
    height:3px;
    background:#15204a;
  }
  .newsletter .mail-icon:before{left:0;transform:rotate(31deg);transform-origin:left center}
  .newsletter .mail-icon:after{right:0;transform:rotate(-31deg);transform-origin:right center}

  .newsletter .email-input{
    padding-left:25px;
    flex:1;
    min-width:0;
    border:0;
    outline:none;
    background:transparent;
    color:#0b153d;
    font-family:Inter,Arial,sans-serif;
    font-size:22px;
    font-weight:500;
  }
  .newsletter .email-input::placeholder{color:#a2adbf}

  .newsletter .subscribe{
    flex:0 0 278px;
    height:84px;
    border:0;
    border-radius:44px;
    background:#0a153d;
    color:#fff;
    font:700 22px Inter,Arial,sans-serif;
    letter-spacing:-.2px;
    cursor:pointer;
    transition:background .25s ease;
  }
  .newsletter .subscribe:hover{background:#7040ef}
  .newsletter .subscribe:disabled{opacity:.6;cursor:not-allowed}

  .newsletter .subscribe span{
    margin-left:18px;
    font-size:30px;
    line-height:0;
    vertical-align:-2px;
  }

  .newsletter .fine{
    margin:20px 0 0 2px;
    color:#9aa5b6;
    font-size:18px;
    letter-spacing:.1px;
    font-weight:500;
  }

  .newsletter .fine.success{color:#7040ef}
  .newsletter .fine.error{color:#d1435b}

  .newsletter .visual{
    position:relative;
    height:700px;
    width:100%;
  }

  .newsletter .orbital{
    position:absolute;
    width:530px;
    height:530px;
    right:70px;
    top:75px;
    border:1px solid rgba(112,64,239,.19);
    border-radius:50%;
  }
  .newsletter .orbital:before{
    content:"";
    position:absolute;
    inset:58px;
    border:1px solid rgba(112,64,239,.10);
    border-radius:50%;
  }
  .newsletter .orbital:after{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    right:18px;
    top:0;
    border-radius:50%;
    background:#6f3ce9;
  }

  .newsletter .panel{
    position:absolute;
    width:610px;
    height:520px;
    right:0;
    top:100px;
    border-radius:32px;
    background:linear-gradient(135deg,rgba(245,242,255,.83),rgba(226,218,255,.44));
    transform:rotate(6deg);
    box-shadow:0 30px 75px rgba(90,53,188,.10);
  }

  .newsletter .panel2{
    position:absolute;
    width:570px;
    height:470px;
    right:40px;
    top:125px;
    border-radius:30px;
    background:rgba(255,255,255,.43);
    transform:rotate(-2deg);
    border:1px solid rgba(124,87,240,.07);
  }

  .newsletter .envelope{
    position:absolute;
    width:535px;
    height:355px;
    right:56px;
    top:205px;
    transform:rotate(-1deg);
    filter:drop-shadow(0 30px 30px rgba(76,45,160,.15));
  }

  .newsletter .env-back{
    position:absolute;
    inset:0;
    border-radius:18px;
    background:linear-gradient(135deg,#8060ed,#5e31d7);
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
  }

  .newsletter .env-paper{
    position:absolute;
    width:350px;
    height:335px;
    left:93px;
    top:-49px;
    background:#fff;
    border-radius:18px 18px 8px 8px;
    transform:rotate(1deg);
    box-shadow:0 12px 28px rgba(55,32,127,.12);
    padding:42px 42px;
  }

  .newsletter .paper-line.big{
    width:160px;height:19px;border-radius:9px;
    background:#8355ec;margin-bottom:24px;
  }

  .newsletter .paper-title{
    color:#7440ea;
    font-size:30px;
    font-weight:800;
    margin-bottom:24px;
  }

  .newsletter .paper-line{
    width:245px;height:13px;border-radius:7px;
    background:#eeeaff;margin:13px 0;
  }
  .newsletter .paper-line.short{width:185px}
  .newsletter .paper-line.tiny{width:145px}

  .newsletter .env-front{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:230px;
    border-radius:0 0 22px 22px;
    background:linear-gradient(145deg,#f8f7ff 0%,#eee9ff 47%,#7250e4 48%,#6538dc 100%);
    clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);
  }

  .newsletter .env-flap{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:210px;
    background:linear-gradient(150deg,#fbfaff 0%,#eee9ff 48%,#8b6cf0 49%,#6639da 100%);
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:18px 18px 0 0;
  }

  .newsletter .bell{
    position:absolute;
    right:18px;
    top:110px;
    width:105px;
    height:105px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,#6f3be5,#4820b9);
    box-shadow:0 15px 35px rgba(74,35,182,.26);
    z-index:5;
  }

  .newsletter .bell-icon{
    position:relative;
    width:35px;
    height:39px;
    border:4px solid #fff;
    border-bottom:0;
    border-radius:19px 19px 6px 6px;
  }
  .newsletter .bell-icon:before{
    content:"";
    position:absolute;
    width:45px;
    height:4px;
    left:-9px;
    bottom:-3px;
    border-radius:5px;
    background:#fff;
  }
  .newsletter .bell-icon:after{
    content:"";
    position:absolute;
    width:7px;height:7px;
    left:10px;bottom:-13px;
    border-radius:50%;
    background:#fff;
  }

  .newsletter .square{
    position:absolute;
    width:10px;height:10px;
    background:#7040e8;
    transform:rotate(45deg);
  }
  .newsletter .square.one{right:24px;top:244px}
  .newsletter .square.two{left:35px;top:340px}
  .newsletter .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#6e3ee8}
  .newsletter .dot.one{right:70px;top:76px}
  .newsletter .dot.two{left:72px;bottom:106px}

  @media(max-width:1200px){
    .newsletter .content{width:min(100% - 64px,1100px);grid-template-columns:53% 47%}
    .newsletter h1{font-size:61px}
    .newsletter .sub{font-size:20px}
    .newsletter .signup{height:72px}
    .newsletter .subscribe{height:72px;flex-basis:225px;font-size:19px}
    .newsletter .visual{transform:scale(.82);transform-origin:center right}
  }

  @media(max-width:820px){
    .newsletter{min-height:900px}
    .newsletter .content{display:block;padding:70px 0}
    .newsletter .left{padding-top:0}
    .newsletter .eyebrow{font-size:13px;letter-spacing:3px;margin-bottom:28px}
    .newsletter h1{font-size:49px;letter-spacing:-2.5px}
    .newsletter .sub{font-size:18px;margin-top:25px}
    .newsletter .signup{height:62px;margin-top:28px}
    .newsletter .mail-icon{margin-left:20px;transform:scale(.8)}
    .newsletter .email-input{font-size:15px;padding-left:12px}
    .newsletter .subscribe{height:62px;flex-basis:145px;font-size:15px}
    .newsletter .subscribe span{font-size:21px;margin-left:8px}
    .newsletter .fine{font-size:14px}
    .newsletter .visual{height:390px;transform:scale(.65);transform-origin:top center;margin-top:25px}
  }

  @media(max-width:500px){
    .newsletter .content{width:calc(100% - 34px)}
    .newsletter h1{font-size:40px}
    .newsletter .signup{height:58px}
    .newsletter .subscribe{height:58px;flex-basis:125px;font-size:14px}
    .newsletter .email-input{font-size:13px}
  }
</style>

<section class="newsletter" aria-label="Truevence newsletter signup">
  <div class="content">

    <div class="left">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        STAY UPDATED
      </div>

      <h1>Get the latest<br>BGV <span class="purple">insights.</span></h1>

      <p class="sub">
        Subscribe to our newsletter for industry updates,<br>
        verification trends and expert insights, straight to your inbox.
      </p>

      <form class="signup" id="newsletterForm" novalidate>
        <span class="mail-icon" aria-hidden="true"></span>
        <input type="email" class="email-input" id="newsletterEmail" placeholder="Enter your email address" required aria-label="Email address">
        <button class="subscribe" type="submit">
          Subscribe <span>→</span>
        </button>
      </form>

      <p class="fine" id="newsletterNote">No spam. Unsubscribe anytime.</p>
    </div>

    <div class="visual" aria-hidden="true">
      <div class="orbital"></div>
      <div class="panel"></div>
      <div class="panel2"></div>

      <div class="envelope">
        <div class="env-back"></div>
        <div class="env-paper">
          <div class="paper-line big"></div>
          <div class="paper-title">Newsletter</div>
          <div class="paper-line"></div>
          <div class="paper-line"></div>
          <div class="paper-line short"></div>
          <div class="paper-line tiny"></div>
        </div>
        <div class="env-flap"></div>
        <div class="env-front"></div>
      </div>

      <div class="bell"><span class="bell-icon"></span></div>
      <span class="square one"></span>
      <span class="square two"></span>
      <span class="dot one"></span>
      <span class="dot two"></span>
    </div>

  </div>
</section>

<script>
(function(){
  const form = document.getElementById('newsletterForm');
  if (!form) return;
  const input = document.getElementById('newsletterEmail');
  const note = document.getElementById('newsletterNote');
  const btn = form.querySelector('button[type="submit"]');
  const originalText = btn.innerHTML;

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = input.value.trim();
    if (!email || !input.checkValidity()) {
      note.textContent = 'Please enter a valid email address.';
      note.classList.remove('success');
      note.classList.add('error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = 'Subscribing...';
    note.textContent = 'No spam. Unsubscribe anytime.';
    note.classList.remove('success','error');

    try {
      const res = await fetch('https://truevence-backend.mamta-neschecks.workers.dev/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          full_name: 'Newsletter Subscriber',
          email: email,
          phone: '',
          company: '',
          message: 'Newsletter signup'
        })
      });
      const result = await res.json();
      if (res.ok && result.success) {
        form.reset();
        note.textContent = 'Thanks! You are subscribed.';
        note.classList.add('success');
      } else {
        throw new Error(result.error || 'Subscription failed');
      }
    } catch (err) {
      note.textContent = 'Something went wrong. Please email Contact@truevence.in';
      note.classList.add('error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  });
})();
</script>
