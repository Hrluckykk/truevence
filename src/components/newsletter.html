<!-- ============ NEWSLETTER ============ -->
<style>
  .newsletter{
    position:relative;
    width:100%;
    min-height:420px;
    overflow:hidden;
    background:
      linear-gradient(rgba(124,58,237,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(124,58,237,.06) 1px,transparent 1px),
      var(--paper);
    background-size:42px 42px;
    color: var(--ink);
  }

  .newsletter:after{
    content:"";
    position:absolute;
    width:520px;
    height:520px;
    right:-60px;
    top:20px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(124,58,237,.12) 0%,rgba(124,58,237,.05) 35%,rgba(124,58,237,0) 72%);
    pointer-events:none;
  }

  .newsletter .nl-inner{
    position:relative;
    z-index:2;
    width:100%;
    max-width:100%;
    padding-left:230px;
    padding-right:220px;
    padding-top:48px;
    padding-bottom:48px;
    display:grid;
    grid-template-columns:55% 45%;
    align-items:center;
    gap:40px;
  }

  .newsletter .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.18em;
    color: var(--violet);
    background: rgba(124,58,237,.10);
    border: 1px solid rgba(124,58,237,.20);
    border-radius:999px;
    padding:6px 16px;
    margin-bottom:28px;
  }
  .newsletter .eyebrow-dot{
    width:6px;height:6px;border-radius:50%;
    background: var(--violet);
  }

  .newsletter .nl-title{
    margin:0;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:800;
    font-size:2.8rem;
    line-height:1.06;
    letter-spacing:-.02em;
    color: var(--ink);
  }
  .newsletter .nl-title .purple{ color: var(--violet); }

  .newsletter .nl-sub{
    margin-top:24px;
    font-family:'Inter', sans-serif;
    font-size:1.125rem;
    line-height:1.65;
    color: var(--slate);
    max-width:34rem;
  }

  .newsletter .signup{
    display:flex;
    align-items:center;
    width:100%;
    max-width:560px;
    height:60px;
    margin-top:36px;
    border:2px solid rgba(11,18,48,.15);
    border-radius:999px;
    background:#fff;
    overflow:hidden;
    transition:border-color .25s ease;
  }
  .newsletter .signup:focus-within{ border-color: var(--violet); }

  .newsletter .mail-icon{
    position:relative;
    flex:0 0 22px;
    width:22px;
    height:17px;
    margin-left:24px;
    border:2px solid var(--ink);
    border-radius:3px;
    opacity:.65;
  }
  .newsletter .mail-icon:before,.newsletter .mail-icon:after{
    content:"";
    position:absolute;
    top:1px;
    width:12px;
    height:2px;
    background: var(--ink);
  }
  .newsletter .mail-icon:before{left:0;transform:rotate(31deg);transform-origin:left center}
  .newsletter .mail-icon:after{right:0;transform:rotate(-31deg);transform-origin:right center}

  .newsletter .email-input{
    padding-left:16px;
    flex:1;
    min-width:0;
    border:0;
    outline:none;
    background:transparent;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:500;
  }
  .newsletter .email-input::placeholder{ color: rgba(84,90,120,.55); }

  .newsletter .subscribe{
    flex:0 0 auto;
    height:60px;
    padding:0 32px;
    border:0;
    border-radius:999px;
    background: var(--ink);
    color:#fff;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:-.01em;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .newsletter .subscribe::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(100deg, var(--navy), var(--violet));
    transform:translateX(-101%);
    transition:transform .45s cubic-bezier(.2,.9,.3,1);
    z-index:-1;
  }
  .newsletter .subscribe:hover::before{ transform:translateX(0); }
  .newsletter .subscribe:disabled{ opacity:.6; cursor:not-allowed; }

  .newsletter .fine{
    margin:14px 0 0 4px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color: rgba(84,90,120,.75);
  }
  .newsletter .fine.success{ color: var(--violet); }
  .newsletter .fine.error{ color:#d1435b; }

  /* Right visual — scaled down but kept proportionate */
  .newsletter .visual{
    position:relative;
    height:340px;
    width:100%;
  }

  .newsletter .orbital{
    position:absolute;
    width:280px;height:280px;
    right:16px;top:30px;
    border:1px solid rgba(124,58,237,.19);
    border-radius:50%;
  }
  .newsletter .orbital:before{
    content:"";
    position:absolute;inset:30px;
    border:1px solid rgba(124,58,237,.10);
    border-radius:50%;
  }
  .newsletter .orbital:after{
    content:"";
    position:absolute;width:6px;height:6px;
    right:10px;top:0;
    border-radius:50%;
    background: var(--violet);
  }

  .newsletter .panel{
    position:absolute;
    width:315px;height:265px;
    right:0;top:44px;
    border-radius:22px;
    background:linear-gradient(135deg,rgba(245,242,255,.83),rgba(226,218,255,.44));
    transform:rotate(6deg);
    box-shadow:0 22px 55px rgba(90,53,188,.10);
  }

  .newsletter .panel2{
    position:absolute;
    width:293px;height:240px;
    right:20px;top:60px;
    border-radius:20px;
    background:rgba(255,255,255,.43);
    transform:rotate(-2deg);
    border:1px solid rgba(124,87,240,.07);
  }

  .newsletter .envelope{
    position:absolute;
    width:275px;height:184px;
    right:30px;top:100px;
    transform:rotate(-1deg);
    filter:drop-shadow(0 18px 18px rgba(76,45,160,.15));
  }

  .newsletter .env-back{
    position:absolute;inset:0;
    border-radius:11px;
    background:linear-gradient(135deg,#8060ed,#5e31d7);
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
  }

  .newsletter .env-paper{
    position:absolute;
    width:184px;height:175px;
    left:47px;top:-26px;
    background:#fff;
    border-radius:11px 11px 6px 6px;
    transform:rotate(1deg);
    box-shadow:0 8px 18px rgba(55,32,127,.12);
    padding:20px;
  }

  .newsletter .paper-line.big{
    width:86px;height:10px;border-radius:5px;
    background:#8355ec;margin-bottom:12px;
  }
  .newsletter .paper-title{
    color: var(--violet);
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:16px;
    font-weight:800;
    margin-bottom:12px;
  }
  .newsletter .paper-line{
    width:130px;height:7px;border-radius:4px;
    background:#eeeaff;margin:7px 0;
  }
  .newsletter .paper-line.short{width:98px}
  .newsletter .paper-line.tiny{width:76px}

  .newsletter .env-front{
    position:absolute;
    left:0;right:0;bottom:0;
    height:120px;
    border-radius:0 0 13px 13px;
    background:linear-gradient(145deg,#f8f7ff 0%,#eee9ff 47%,#7250e4 48%,#6538dc 100%);
    clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);
  }

  .newsletter .env-flap{
    position:absolute;
    left:0;right:0;top:0;
    height:109px;
    background:linear-gradient(150deg,#fbfaff 0%,#eee9ff 48%,#8b6cf0 49%,#6639da 100%);
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:11px 11px 0 0;
  }

  .newsletter .bell{
    position:absolute;
    right:8px;top:52px;
    width:54px;height:54px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,#6f3be5,#4820b9);
    box-shadow:0 10px 25px rgba(74,35,182,.26);
    z-index:5;
  }
  .newsletter .bell-icon{
    position:relative;
    width:18px;height:21px;
    border:2.5px solid #fff;
    border-bottom:0;
    border-radius:10px 10px 3px 3px;
  }
  .newsletter .bell-icon:before{
    content:"";position:absolute;
    width:23px;height:2.5px;
    left:-4px;bottom:-2px;
    border-radius:3px;background:#fff;
  }
  .newsletter .bell-icon:after{
    content:"";position:absolute;
    width:4px;height:4px;
    left:5px;bottom:-7px;
    border-radius:50%;background:#fff;
  }

  .newsletter .square{
    position:absolute;width:6px;height:6px;
    background: var(--violet);
    transform:rotate(45deg);
  }
  .newsletter .square.one{right:12px;top:128px}
  .newsletter .square.two{left:18px;top:172px}
  .newsletter .dot{position:absolute;width:6px;height:6px;border-radius:50%;background: var(--violet);}
  .newsletter .dot.one{right:36px;top:36px}
  .newsletter .dot.two{left:38px;bottom:52px}

  @media(max-width:1440px){
    .newsletter .nl-inner{ padding-left:120px; padding-right:100px; }
  }
  @media(max-width:1200px){
    .newsletter .nl-inner{ padding-left:80px; padding-right:60px; grid-template-columns:55% 45%; }
    .newsletter .nl-title{ font-size:2.3rem; }
    .newsletter .nl-sub{ font-size:1rem; }
    .newsletter .visual{ transform:scale(.88); transform-origin:center right; }
  }
  @media(max-width:1023px){
    .newsletter .nl-inner{
      grid-template-columns:1fr;
      padding-left:32px; padding-right:32px;
      padding-top:48px; padding-bottom:48px;
      gap:28px;
    }
    .newsletter .visual{ display:none; }
    .newsletter .nl-title{ font-size:2rem; }
  }
  @media(max-width:640px){
    .newsletter .nl-inner{ padding-left:20px; padding-right:20px; }
    .newsletter .nl-title{ font-size:1.75rem; }
    .newsletter .signup{ height:54px; }
    .newsletter .subscribe{ height:54px; padding:0 22px; font-size:13px; }
    .newsletter .email-input{ font-size:14px; }
    .newsletter .mail-icon{ margin-left:18px; transform:scale(.9); }
  }
</style>

<section class="newsletter" aria-label="Truevence newsletter signup">
  <div class="nl-inner">

    <div class="nl-left">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        STAY UPDATED
      </div>

      <h2 class="nl-title">
        Get the latest<br>BGV <span class="purple">insights.</span>
      </h2>

      <p class="nl-sub">
        Subscribe to our newsletter for industry updates, verification trends and expert insights, straight to your inbox.
      </p>

      <form class="signup" id="newsletterForm" novalidate>
        <span class="mail-icon" aria-hidden="true"></span>
        <input type="email" class="email-input" id="newsletterEmail" placeholder="Enter your email address" required aria-label="Email address">
        <button class="subscribe" type="submit">Subscribe</button>
      </form>

      <p class="fine" id="newsletterNote">No spam. Unsubscribe anytime.</p>
    </div>

    <div class="visual" aria-hidden="true">
      <div class="orbital"></div>
      <div class="panel"></div>
      <div class="panel2"></div>

      <div class="envelope">
        <div class="env-back"></div>
        <div class="env-paper">
          <div class="paper-line big"></div>
          <div class="paper-title">Newsletter</div>
          <div class="paper-line"></div>
          <div class="paper-line"></div>
          <div class="paper-line short"></div>
          <div class="paper-line tiny"></div>
        </div>
        <div class="env-flap"></div>
        <div class="env-front"></div>
      </div>

      <div class="bell"><span class="bell-icon"></span></div>
      <span class="square one"></span>
      <span class="square two"></span>
      <span class="dot one"></span>
      <span class="dot two"></span>
    </div>

  </div>
</section>

<script>
(function(){
  const form = document.getElementById('newsletterForm');
  if (!form) return;
  const input = document.getElementById('newsletterEmail');
  const note = document.getElementById('newsletterNote');
  const btn = form.querySelector('button[type="submit"]');
  const originalText = btn.innerHTML;

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = input.value.trim();
    if (!email || !input.checkValidity()) {
      note.textContent = 'Please enter a valid email address.';
      note.classList.remove('success');
      note.classList.add('error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = 'Subscribing...';
    note.textContent = 'No spam. Unsubscribe anytime.';
    note.classList.remove('success','error');

    try {
      const res = await fetch('https://truevence-backend.mamta-neschecks.workers.dev/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          full_name: 'Newsletter Subscriber',
          email: email,
          phone: '',
          company: '',
          message: 'Newsletter signup'
        })
      });
      const result = await res.json();
      if (res.ok && result.success) {
        form.reset();
        note.textContent = 'Thanks! You are subscribed.';
        note.classList.add('success');
      } else {
        throw new Error(result.error || 'Subscription failed');
      }
    } catch (err) {
      note.textContent = 'Something went wrong. Please contact us at Contact@truevence.in';
      note.classList.add('error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  });
})();
</script>
