<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Truevence — Back Shortly</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100vh;
    overflow: hidden;
    background: #0B1230 !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body > *:not(#maintenance-overlay) {
    display: none !important;
  }

  /* Grid background */
  #maintenance-overlay {
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px;
    color: #fff;
    text-align: center;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 50% 40%, rgba(124, 58, 237, 0.15), transparent 45%),
      #0B1230;
    background-size: 34px 34px, 34px 34px, auto, auto;
  }

  /* Ambient glows */
  #maintenance-overlay::before {
    content: '';
    position: absolute;
    top: -40%; right: -40%;
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.18), transparent 65%);
    border-radius: 50%;
    pointer-events: none;
  }
  #maintenance-overlay::after {
    content: '';
    position: absolute;
    bottom: -40%; left: -40%;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.12), transparent 65%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Full-screen scan line */
  .scan-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(167, 139, 250, 0.4) 20%,
      #fff 50%,
      rgba(167, 139, 250, 0.4) 80%,
      transparent 100%);
    box-shadow:
      0 0 24px rgba(124, 58, 237, 0.9),
      0 0 60px rgba(124, 58, 237, 0.5);
    top: 0;
    z-index: 5;
    pointer-events: none;
    animation: scan-sweep 4.5s ease-in-out infinite;
  }

  @keyframes scan-sweep {
    0%   { top: -4px;             opacity: 0; }
    8%   { opacity: 1; }
    48%  { top: calc(100% + 4px); opacity: 1; }
    56%  { opacity: 0; }
    100% { top: calc(100% + 4px); opacity: 0; }
  }

  /* Scan corners around the wrap */
  .scan-stage {
    position: relative;
    z-index: 2;
    max-width: 560px;
    padding: 40px 32px;
    border-radius: 20px;
    background: rgba(11, 18, 48, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.4),
      inset 0 0 0 1px rgba(167, 139, 250, 0.15);
  }
  .scan-stage::before,
  .scan-stage::after {
    content: '';
    position: absolute;
    width: 44px;
    height: 44px;
    border-color: #A78BFA;
    border-style: solid;
    pointer-events: none;
    z-index: 3;
  }
  .scan-stage::before {
    top: -2px; left: -2px;
    border-width: 2px 0 0 2px;
    border-top-left-radius: 20px;
  }
  .scan-stage::after {
    bottom: -2px; right: -2px;
    border-width: 0 2px 2px 0;
    border-bottom-right-radius: 20px;
  }

  /* Pulse-dot badge */
  .m-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: 1px solid rgba(167, 139, 250, 0.3);
    background: rgba(124, 58, 237, 0.1);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: #A78BFA;
    margin-bottom: 28px;
    text-transform: uppercase;
  }
  .m-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #A78BFA;
    animation: m-pulse 1.6s ease-in-out infinite;
  }
  @keyframes m-pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  #maintenance-overlay h1 {
    font-size: clamp(1.9rem, 5.5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1.06;
    margin-bottom: 18px;
    background: linear-gradient(100deg, #fff 10%, #A78BFA 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #maintenance-overlay p {
    color: rgba(255, 255, 255, 0.6);
    font-size: 15px;
    line-height: 1.65;
    margin-bottom: 32px;
  }

  /* Progress bar */
  .m-progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .m-progress-track {
    flex: 1;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .m-progress-bar {
    display: block;
    height: 100%;
    width: 78%;
    background: linear-gradient(90deg, #7C3AED, #C9BEFB);
    border-radius: inherit;
    animation: m-progress-loop 4s ease-in-out infinite;
  }
  @keyframes m-progress-loop {
    0%, 100% { width: 62%; }
    50%      { width: 88%; }
  }
  .m-progress-value {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    color: #C9BEFB;
    letter-spacing: 0.05em;
    min-width: 44px;
    text-align: right;
    animation: m-count 4s ease-in-out infinite;
  }
  @keyframes m-count {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .m-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .m-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    transition: all 0.25s ease;
  }
  .m-primary {
    background: #7C3AED;
    color: #fff;
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
  }
  .m-primary:hover {
    background: #6D28D9;
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(124, 58, 237, 0.45);
  }
  .m-secondary {
    background: transparent;
    color: #A78BFA;
    border: 2px solid rgba(167, 139, 250, 0.3);
  }
  .m-secondary:hover {
    border-color: #A78BFA;
    color: #fff;
  }

  .m-footer {
    margin-top: 36px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.3);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    .scan-line,
    .m-dot,
    .m-progress-bar,
    .m-progress-value {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div id="maintenance-overlay">
  <div class="scan-line"></div>

  <div class="scan-stage">
    <div class="m-badge"><span class="m-dot"></span>Upgrading Infrastructure</div>
    <h1>We're making Truevence faster.</h1>
    <p>We're upgrading our systems to serve you better. The site will be back very soon. Thanks for your patience.</p>

    <div class="m-progress">
      <div class="m-progress-track">
        <span class="m-progress-bar"></span>
      </div>
      <span class="m-progress-value">78%</span>
    </div>

    <div class="m-actions">
      <a href="mailto:contact@truevence.in" class="m-btn m-primary">Email Us →</a>
      <a href="tel:+919205757344" class="m-btn m-secondary">Call +91 920 5757 344</a>
    </div>
    <div class="m-footer">Truevence.in</div>
  </div>
</div>
