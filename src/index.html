<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truevence – Under Maintenance</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #0B1230;
            --navy: #131B45;
            --violet: #7C3AED;
            --violetlt: #A78BFA;
            --lavender: #C9BEFB;
            --angle: 0deg;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--ink);
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Scan grid background */
        .scan-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 34px 34px;
            z-index: 1;
        }

        /* Ambient Glow Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--violet);
            top: -200px;
            right: -200px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--lavender);
            bottom: -150px;
            left: -150px;
            opacity: 0.15;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        /* ---- Status Badge ---- */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            color: var(--violetlt);
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 9999px;
            padding: 6px 18px 6px 14px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--violet);
            animation: pulse-dot 1.8s ease-in-out infinite;
            margin-right: 4px;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        /* ---- Heading ---- */
        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: clamp(2.2rem, 8vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .grad-text {
            background: linear-gradient(100deg, #fff 10%, var(--violet) 55%, var(--violetlt) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
            margin-bottom: 3rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* ---- Scan Box (The core container for the scanning animation) ---- */
        .scan-box {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 3rem 2rem;
            backdrop-filter: blur(4px);
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }

        /* Scanning Line Animation */
        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--violet), var(--lavender), var(--violet), transparent);
            box-shadow: 0 0 20px 4px rgba(124, 58, 237, 0.4);
            animation: scan-move 3.4s ease-in-out infinite;
            z-index: 10;
            top: 0;
        }

        @keyframes scan-move {
            0% { top: 0; opacity: 0; }
            8% { opacity: 1; }
            48% { top: 92%; opacity: 1; }
            56% { opacity: 0; }
            100% { top: 92%; opacity: 0; }
        }

        /* ---- Timer ---- */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            position: relative;
            z-index: 5;
        }

        .timer-block {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .timer-block .num {
            font-family: 'IBM Plex Mono', monospace;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            font-weight: 600;
            color: #fff;
            line-height: 1.1;
            letter-spacing: 0.04em;
        }

        .timer-block .label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* ---- Loading Dots ---- */
        .loading-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 2.5rem;
            z-index: 5;
            position: relative;
        }

        .loading-dots span {
            display: block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--violet);
            opacity: 0.2;
            transform: scale(0.8);
            animation: dot-bounce 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-bounce {
            0%, 80%, 100% { 
                opacity: 0.2; 
                transform: scale(0.8);
                background: var(--violet);
            }
            40% { 
                opacity: 1; 
                transform: scale(1.2);
                background: var(--violetlt);
                box-shadow: 0 0 20px var(--violet);
            }
        }

        /* ---- Footer ---- */
        .footer {
            position: relative;
            z-index: 5;
            margin-top: 3rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.15);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--violetlt);
        }

        /* ---- Responsive ---- */
        @media (max-width: 640px) {
            .scan-box {
                padding: 1.5rem 1rem;
                border-radius: 20px;
            }
            .timer-grid {
                gap: 8px;
            }
            .timer-block {
                padding: 12px 4px;
            }
            .timer-block .num {
                font-size: 2rem;
            }
            .status-badge {
                font-size: 10px;
                padding: 4px 14px 4px 10px;
            }
            .loading-dots span {
                width: 10px;
                height: 10px;
            }
            .sub-text {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .timer-block .num {
                font-size: 1.6rem;
            }
            .timer-block .label {
                font-size: 8px;
            }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
            .scan-line {
                display: none;
            }
            .loading-dots span {
                animation: none !important;
                opacity: 0.4;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- Background Effects -->
    <div class="scan-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- Status Badge -->
        <div class="status-badge">
            <span class="pulse-dot"></span>
            System Upgrade
        </div>

        <!-- Heading -->
        <h1>
            We'll be back<br>
            <span class="grad-text">soon.</span>
        </h1>
        <p class="sub-text">
            We are currently enhancing our infrastructure to serve you better.
            <br class="hidden sm:block">
            Estimated time remaining:
        </p>

        <!-- Scan Box with Timer -->
        <div class="scan-box">
            <!-- The moving scan line -->
            <div class="scan-line"></div>

            <!-- Timer Display -->
            <div class="timer-grid">
                <div class="timer-block">
                    <div class="num" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="timer-block">
                    <div class="num" id="minutes">00</div>
                    <div class="label">Mins</div>
                </div>
                <div class="timer-block">
                    <div class="num" id="seconds">00</div>
                    <div class="label">Secs</div>
                </div>
                <div class="timer-block">
                    <div class="num" id="milliseconds">00</div>
                    <div class="label">Ms</div>
                </div>
            </div>

            <!-- Loading Dots -->
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 <a href="https://www.truevence.in">Truevence</a> &nbsp;—&nbsp; Background Verification, Done Right.
        </div>

    </div>

    <!-- Timer Script -->
    <script>
        (function() {
            // Set target time (e.g., 2 hours and 45 minutes from now)
            const target = new Date();
            target.setHours(target.getHours() + 2);
            target.setMinutes(target.getMinutes() + 45);
            target.setSeconds(0);

            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const millisecondsEl = document.getElementById('milliseconds');

            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function updateTimer() {
                const now = new Date();
                const diff = Math.max(0, target - now);

                const h = Math.floor(diff / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                const ms = Math.floor((diff % 1000) / 10);

                hoursEl.textContent = pad(h);
                minutesEl.textContent = pad(m);
                secondsEl.textContent = pad(s);
                millisecondsEl.textContent = pad(ms);

                if (diff <= 0) {
                    clearInterval(interval);
                    document.querySelector('.timer-grid').innerHTML = `
                        <div class="timer-block" style="grid-column: 1/-1; padding: 20px 0; background: transparent; border: none;">
                            <div class="num" style="font-size: 2rem; color: #A78BFA;">We're back!</div>
                            <div class="label" style="margin-top: 8px; color: rgba(255,255,255,0.5);">Please refresh the page.</div>
                        </div>
                    `;
                    document.querySelector('.loading-dots').style.display = 'none';
                }
            }

            updateTimer();
            const interval = setInterval(updateTimer, 10);
        })();
    </script>

</body>
</html>
